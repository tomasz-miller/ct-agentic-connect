deployAs:
  - name: service
    applicationType: service
    endpoint: /service
    scripts:
      postDeploy: npm install && npm run build && npm run connector:post-deploy
      preUndeploy: npm install && npm run build && npm run connector:pre-undeploy
    configuration:
      standardConfiguration:
        - key: CTP_REGION
          description: commercetools Composable Commerce API region
          required: true
          default: "europe-west1.gcp"
        - key: MIN_CART_CENT_AMOUNT
          description: Minimum cart totalPrice.centAmount required after create/update (default 1000 = 10.00 in major units)
          required: false
          default: "1000"
        - key: MIN_CART_CURRENCY
          description: Currency code the minimum applies to (empty = any currency)
          required: false
          default: ""
      securedConfiguration:
        - key: CTP_PROJECT_KEY
          description: commercetools Composable Commerce project key
          required: true
        - key: CTP_CLIENT_ID
          description: commercetools Composable Commerce client ID
          required: true
        - key: CTP_CLIENT_SECRET
          description: commercetools Composable Commerce client secret
          required: true
        - key: CTP_SCOPE
          description: commercetools Composable Commerce client scope (needs manage_extensions + view_products as needed)
          required: true
